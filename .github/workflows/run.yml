name: Saudi Market Scanner Cron

on:
  schedule:
    # المواعيد مضبوطة بتوقيت UTC (السعودية = UTC + 3) للأيام من الأحد للخميس (0-4)
    
    # 1. الساعة 07:00 صباحاً بتوقيت السعودية (04:00 UTC)
    - cron: '0 4 * * 0-4'
    
    # 2. كل 30 دقيقة من 10:00 صباحاً وحتى 15:00 بتوقيت السعودية (07:00 - 12:00 UTC)
    - cron: '0,30 7-12 * * 0-4'
    
    # 3. مع إغلاق الجلسة الساعة 15:15 بتوقيت السعودية (12:15 UTC)
    - cron: '15 12 * * 0-4'
    
    # 4. بعد المزاد النهائي الساعة 15:30 بتوقيت السعودية (12:30 UTC)
    - cron: '30 12 * * 0-4'

  workflow_dispatch: # يتيح لك إمكانية التشغيل اليدوي من GitHub في أي وقت

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: جلب السورس كود
        uses: actions/checkout@v3

      - name: إعداد بيئة Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: تشغيل الفحص
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
